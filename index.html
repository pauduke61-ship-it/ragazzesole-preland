<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incontri nella tua città</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#ffe8ec 0%,#fff 100%);text-align:center;padding:24px 16px;min-height:100vh}
  .wrap{max-width:480px;margin:0 auto}
  h1{color:#c2185b;font-size:26px;margin:16px 0;line-height:1.3}
  .sub{color:#666;font-size:15px;margin:8px 0 20px}
  .profiles{font-size:13px;color:#888;margin:12px 0}
  .btn{display:block;width:100%;background:#e91e63;color:#fff;padding:18px;border-radius:10px;text-decoration:none;font-size:19px;font-weight:bold;margin:18px 0;box-shadow:0 4px 14px rgba(233,30,99,.35);border:none;cursor:pointer}
  .btn:active{transform:scale(0.98)}
  .timer{color:#c2185b;font-weight:bold;font-size:14px;margin-top:16px}
  .legal{font-size:11px;color:#999;margin-top:24px}
</style>
</head>
<body>
  <div class="wrap">
    <h1>👩 Ragazze vicino a te<br>ti aspettano!</h1>
    <p class="sub">Oltre 12.000 donne single registrate nella tua zona</p>
    <p class="profiles">📍 Roma · Milano · Napoli · Torino · Bologna</p>
    <button class="btn" onclick="window.location.href='https://tone.affomelody.com/click?pid=20175&offer_id=591&sub1=PRELAND'">
      Vedi i profili gratis →
    </button>
    <p class="timer">⚡ Solo oggi: registrazione gratuita</p>
    <p class="legal">Accettando, confermi di avere almeno 18 anni. Privacy Policy applicabile.</p>
  </div>
  <script>
    // антибот: блокируем клики без реального interaction
    document.addEventListener('contextmenu',e=>e.preventDefault());
  </script>
</body>
</html>
